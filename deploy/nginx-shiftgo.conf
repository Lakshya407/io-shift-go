# Nginx reverse proxy for ShiftGo. Copy to /etc/nginx/sites-available/shiftgo,
# replace cab.yourcompany.com, enable it, then run:
#   sudo certbot --nginx -d cab.yourcompany.com
# certbot adds the HTTPS (443) server block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name cab.yourcompany.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Client IP used for login rate limiting. If an AWS load balancer sits in
        # front of Nginx, configure ngx_http_realip_module so $remote_addr is the
        # real client and not the load balancer.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
