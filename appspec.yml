# AWS CodeDeploy (EC2/on-premises) — deploys the revision produced by buildspec.yml.
#
# Layout on the instance:
#   /opt/shiftgo/staging           this revision as delivered by CodeDeploy
#   /opt/shiftgo/releases/<id>/    one folder per deployment (last 3 kept)
#   /opt/shiftgo/current           symlink to the live release
#   /var/lib/shiftgo/shiftgo.db    SQLite database (never touched by deployments)
#   /var/lib/shiftgo/backups/      database copy taken before every deployment
#   /etc/shiftgo.env               configuration and secrets (created once, by you)
#
# Every hook runs as root. A non-zero exit fails the deployment; with automatic
# rollback enabled on the deployment group, CodeDeploy redeploys the last good revision.
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/shiftgo/staging

file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: deploy/application-stop.sh
      timeout: 60
      runas: root
  BeforeInstall:
    - location: deploy/before-install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: deploy/after-install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: deploy/application-start.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: deploy/validate-service.sh
      timeout: 180
      runas: root
