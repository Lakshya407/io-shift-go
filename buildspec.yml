# AWS CodeBuild — builds, tests and packages ShiftGo for CodeDeploy (EC2).
# Image: aws/codebuild/amazonlinux-x86_64-standard:5.0 (or newer) with Node.js 22.
# Output artifact (the CodeDeploy revision):
#   appspec.yml        CodeDeploy instructions
#   deploy/            lifecycle hook scripts + systemd unit + config templates
#   app/               self-contained Node.js server (dist/standalone)
version: 0.2

env:
  variables:
    NODE_OPTIONS: "--max-old-space-size=3072"
    npm_config_audit: "false"
    npm_config_fund: "false"

phases:
  install:
    runtime-versions:
      nodejs: 22
    on-failure: ABORT
    commands:
      - node -v && npm -v
      # The server and tests use the built-in SQLite module (Node >= 22.13).
      - node -e "require('node:sqlite')"
      - npm ci

  pre_build:
    on-failure: ABORT
    commands:
      - npm run typecheck
      - npm test

  build:
    on-failure: ABORT
    commands:
      - npm run build:node
      # Assemble the CodeDeploy revision.
      - rm -rf release && mkdir -p release/app
      - cp -a dist/standalone/. release/app/
      - cp appspec.yml release/
      - cp -a deploy release/deploy
      - chmod +x release/deploy/*.sh
      - echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}" > release/app/REVISION
      - du -sh release

artifacts:
  base-directory: release
  files:
    - "**/*"

cache:
  paths:
    - "/root/.npm/**/*"
