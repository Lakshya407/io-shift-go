# Reverse proxy in front of the ShiftGo container (docker-compose.yml).
# Mirrors deploy/nginx-shiftgo.conf. The app runs with VINEXT_TRUST_PROXY=1, so it
# reads X-Real-IP (per-client login rate limiting) and X-Forwarded-Proto
# (Secure cookies) from here. The app container is not published directly, so
# these headers can only come from this proxy.
#
# TLS: terminate HTTPS in front of this container (AWS ALB, Cloudflare, Traefik,
# a host Nginx + certbot, ...). Geolocation and login cookies need HTTPS outside
# of localhost.

# Keep the scheme reported by an upstream TLS terminator; otherwise use our own.
map $http_x_forwarded_proto $shiftgo_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        # $http_host keeps the port (e.g. localhost:8080), which the app's
        # same-origin check compares against the browser's Origin header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $shiftgo_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Client IP used for login rate limiting. If a load balancer sits in front
        # of this proxy, configure ngx_http_realip_module so $remote_addr is the
        # real client and not the load balancer.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
