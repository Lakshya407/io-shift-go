# ShiftGo cab app: Docker Compose stack.
#
#   cp .env.example .env    # fill in SITE_URL, SETUP_TOKEN, POSTGRES_PASSWORD, Azure SSO …
#   docker compose up -d --build                       postgres + app + Nginx → http://localhost:8088
#   docker compose --profile automation up -d --build  … + n8n                → http://localhost:5678
#
# All configuration and secrets live in .env (git-ignored); this file holds no secrets.
# Schema migrations run automatically when the app starts.

name: shiftgo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiftgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shiftgo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Not published on the host. To connect from your machine (psql, DBeaver), uncomment:
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      target: runtime
    image: shiftgo-cab:latest
    restart: unless-stopped
    init: true                    # forwards SIGTERM so `docker compose stop` is quick
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # An explicit DATABASE_URL in .env wins (external/managed Postgres).
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-shiftgo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shiftgo}}
      # Safe only because the app port is not published: Nginx is the sole client.
      VINEXT_TRUST_PROXY: "1"
      SITE_URL: ${SITE_URL:-http://localhost:8088}
    expose:
      - "3000"
    stop_grace_period: 20s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${SHIFTGO_HTTP_PORT:-8088}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Optional: self-hosted n8n for Teams / email delivery (automations/README.md).
  # Import automations/*.json, set each workflow's baseUrl to http://app:3000,
  # and in .env set N8N_WEBHOOK_URL=http://n8n:5678/webhook/cab-notification-wakeup.
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    profiles: ["automation"]
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      # Required to log in over plain http://localhost; remove once n8n is behind HTTPS.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "${N8N_HTTP_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  postgres-data:
  n8n-data:
