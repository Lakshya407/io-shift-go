# ShiftGo app: one replica (the every-minute SOS/report tick runs inside the process).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiftgo
  namespace: shiftgo
  labels:
    app.kubernetes.io/name: shiftgo
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate             # never two app pods (and two maintenance ticks) at once
  selector:
    matchLabels:
      app.kubernetes.io/name: shiftgo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shiftgo
      annotations:
        # Change to force a restart after editing the shiftgo-env Secret by hand.
        shiftgo/config-revision: "1"
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532         # "nonroot" user of the distroless image
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: shiftgo
          image: shiftgo-cab:set-by-kustomize   # replaced by kustomization.yaml (newName/newTag)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: shiftgo-env
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            # The pod is only reachable through the ingress controller, which sets these headers.
            - name: VINEXT_TRUST_PROXY
              value: "1"
            # Fail (pod not ready) instead of falling back to SQLite if DATABASE_URL is missing.
            - name: SHIFTGO_REQUIRE_POSTGRES
              value: "1"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shiftgo
  namespace: shiftgo
  labels:
    app.kubernetes.io/name: shiftgo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shiftgo
  ports:
    - name: http
      port: 80
      targetPort: http
